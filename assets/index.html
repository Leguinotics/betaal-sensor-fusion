<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Rhythm Trainer Workspace</title>
  <link rel="stylesheet" type="text/css" href="style.css">
  <style>
    body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 20px; }
    .card { max-width: 600px; margin: 20px auto; background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    select { background: #333; color: #00ffcc; border: 1px solid #00ffcc; padding: 10px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; outline: none; }
    .status-badge { display: inline-block; padding: 8px 16px; font-weight: bold; border-radius: 20px; margin-top: 15px; font-size: 18px; }
    .SETUP { background: #555; color: #fff; }
    .MONITORING { background: #007bff; color: #fff; animation: pulse 2s infinite; }
    .CALIBRATING { background: #ffc107; color: #000; }
    .BLIND { background: #dc3545; color: #fff; }
    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
  </style>
</head>
<body>

  <div class="card">
    <h1>🥁 AI Rhythm Trainer Workspace</h1>
    <p style="color: #aaa;">Select a time signature structure, then tap your sensor to begin training.</p>
    
    <div style="margin: 20px 0;">
      <label style="font-size: 16px; margin-right: 10px;">Beat Type:</label>
      <select id="beatSelector" onchange="updateBeatType()">
        <option value="" disabled selected>Choose a signature...</option>
        <option value="2/4">2/4 Signature Beat</option>
        <option value="3/4">3/4 Signature Beat</option>
        <option value="4/4">4/4 Signature Beat</option>
      </select>
    </div>

    <div id="phaseBadge" class="status-badge SETUP">PHASE: INITIAL SETUP</div>
    <p id="phaseDescription" style="color: #00ffcc; margin-top: 15px; font-weight: bold;">Select a beat structure above to arm the system.</p>
  </div>

  <!-- FIX: Load socket.io from a globally validated cloud CDN instead of local paths -->
  <script src="https://socket.io"></script>
  
  <script>
    // Initialize the real-time background channel connection natively
    const socket = io();

    function updateBeatType() {
        const selectedValue = document.getElementById("beatSelector").value;
        // Transmit selection dictionary to python state machine
        socket.emit("change_beat", { beat: selectedValue });
    }

    // Capture upcoming text logs passing up from Python
    socket.on("phase_update", (msg) => {
        try {
            const data = JSON.parse(msg);
            const badge = document.getElementById("phaseBadge");
            const desc = document.getElementById("phaseDescription");
            
            badge.className = `status-badge ${data.phase}`;
            badge.innerText = `PHASE: ${data.phase}`;
            desc.innerText = data.msg;
        } catch(e) {
            console.error("Layout parse fault:", e);
        }
    });
  </script>
</body>
</html>
